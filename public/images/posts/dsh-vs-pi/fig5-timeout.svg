<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292"><defs><marker id="a-mut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><rect width="960" height="292" fill="#ffffff"/><text x="36" y="42" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0f172a" text-anchor="start" font-weight="650">120 s timeout turns one call into a polling loop</text><text x="36" y="68" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">Long builds are promoted to a background job instead of being killed.</text><text x="36" y="128" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="650">DSH</text><rect x="96" y="104" width="150" height="48" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="171" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="400">bash (120 s)</text><rect x="276" y="104" width="150" height="48" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="351" y="133" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="400">still running</text><rect x="456" y="104" width="150" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="531" y="133" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">promoted + jobId</text><rect x="636" y="104" width="120" height="48" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="696" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="400">job_output</text><rect x="786" y="104" width="120" height="48" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="846" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="400">job_output</text><line x1="246" y1="128" x2="272" y2="128" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)" stroke-linecap="round"/><line x1="426" y1="128" x2="452" y2="128" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)" stroke-linecap="round"/><line x1="606" y1="128" x2="632" y2="128" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)" stroke-linecap="round"/><line x1="756" y1="128" x2="782" y2="128" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)" stroke-linecap="round"/><text x="696" y="184" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">N polls = N model turns</text><text x="36" y="234" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#b45309" text-anchor="start" font-weight="650">pi</text><rect x="96" y="210" width="250" height="48" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><text x="221" y="239" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="400">bash (no default timeout)</text><line x1="346" y1="234" x2="470" y2="234" stroke="#b45309" stroke-width="1.6" marker-end="url(#a-amber)" stroke-linecap="round"/><rect x="474" y="210" width="170" height="48" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="559" y="239" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="600">one result, one turn</text></svg>