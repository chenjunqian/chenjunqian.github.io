<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316"><defs><marker id="a-mut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><rect width="960" height="316" fill="#ffffff"/><text x="36" y="42" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0f172a" text-anchor="start" font-weight="650">One shell command vs three tool calls</text><text x="36" y="68" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">The prompt routes discovery and reading to dedicated tools; those tools are exclusive.</text><rect x="36" y="96" width="96" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="84" y="123" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">pi</text><rect x="150" y="90" width="360" height="56" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><text x="166" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400">bash -c 'ls &amp;&amp; rg foo | head'</text><text x="166" y="134" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">one call, any shell syntax</text><line x1="510" y1="118" x2="556" y2="118" stroke="#b45309" stroke-width="1.6" marker-end="url(#a-amber)" stroke-linecap="round"/><rect x="560" y="96" width="170" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="645" y="123" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="650">1 model turn</text><rect x="36" y="210" width="96" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="84" y="237" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="650">DSH</text><rect x="150" y="204" width="132" height="56" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="216" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="650">glob</text><text x="216" y="248" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">not find</text><rect x="310" y="204" width="132" height="56" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="376" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="650">grep</text><text x="376" y="248" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">not rg</text><line x1="280" y1="232" x2="308" y2="232" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)" stroke-linecap="round"/><rect x="470" y="204" width="132" height="56" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="536" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="650">read</text><text x="536" y="248" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">not cat</text><line x1="440" y1="232" x2="468" y2="232" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)" stroke-linecap="round"/><line x1="622" y1="232" x2="668" y2="232" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)" stroke-linecap="round"/><rect x="672" y="204" width="170" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="757" y="227" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="650">3 model turns</text><text x="757" y="247" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="400">+ 3 context resends</text><text x="154" y="292" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">barrier → barrier → barrier</text></svg>