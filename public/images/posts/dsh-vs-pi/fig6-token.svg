<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350"><defs><marker id="a-mut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><rect width="960" height="350" fill="#ffffff"/><text x="36" y="42" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0f172a" text-anchor="start" font-weight="650">Tokens ≈ steps × context, not prompt size</text><rect x="36" y="74" width="420" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="246" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">cost ≈ Σ turns ( prefix + history so far )</text><text x="36" y="170" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="650">Step one, measured</text><text x="36" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">DSH</text><rect x="80" y="180" width="140" height="18" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="228" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">8.9k</text><text x="36" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="600">pi</text><rect x="80" y="208" width="228" height="18" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1"/><text x="316" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="600">14.5k</text><text x="36" y="258" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">The prefix is not the problem.</text><text x="36" y="278" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Every extra call adds a full resend.</text><text x="520" y="90" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Context growth per turn (schematic)</text><line x1="540" y1="300" x2="916" y2="300" stroke="#cbd5e1" stroke-width="1.3" stroke-linecap="round"/><line x1="540" y1="300" x2="540" y2="110" stroke="#cbd5e1" stroke-width="1.3" stroke-linecap="round"/><path d="M540 300 C 620 290, 700 250, 916 128 L916 300 Z" fill="#eff6ff" opacity="0.9"/><path d="M540 300 C 600 292, 660 268, 916 176 L916 300 Z" fill="#fffbeb" opacity="0.9"/><path d="M540 300 C 620 290, 700 250, 916 128" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M540 300 C 600 292, 660 268, 916 176" fill="none" stroke="#b45309" stroke-width="2"/><text x="880" y="120" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="650">DSH</text><text x="880" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="650">pi</text><text x="918" y="316" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="400">turns</text><text x="36" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Area under each curve ≈ tokens paid. Different tasks: treat the curve as shape, not data.</text></svg>