<svg xmlns="http://www.w3.org/2000/svg" width="960" height="286" viewBox="0 0 960 286"><defs><marker id="a-mut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><rect width="960" height="286" fill="#ffffff"/><text x="36" y="42" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0f172a" text-anchor="start" font-weight="650">Read-before-write (DSH 0.2.1)</text><text x="36" y="68" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">One extra turn per modified file; new files skip the read.</text><rect x="742" y="52" width="182" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="833" y="71" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">0.2.2: ships disabled</text><rect x="32" y="140" width="160" height="72" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/><text x="112" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="650">write(path)</text><text x="112" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">tool call</text><rect x="216" y="140" width="160" height="72" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/><text x="296" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="650">fs/write-intent</text><text x="296" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">unseen → createIfAbsent</text><rect x="400" y="140" width="160" height="72" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/><text x="480" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="650">provider check</text><text x="480" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">createIfAbsent + exists?</text><rect x="584" y="140" width="160" height="72" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="664" y="170" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="650">FS_NOT_OBSERVED</text><text x="664" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">write refused</text><rect x="768" y="140" width="160" height="72" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="848" y="170" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#059669" text-anchor="middle" font-weight="650">read → retry</text><text x="848" y="194" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">fs/observed → write</text><line x1="192" y1="176" x2="212" y2="176" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-mut)" stroke-linecap="round"/><line x1="376" y1="176" x2="396" y2="176" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-mut)" stroke-linecap="round"/><line x1="560" y1="176" x2="580" y2="176" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-red)" stroke-linecap="round"/><line x1="744" y1="176" x2="764" y2="176" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-red)" stroke-linecap="round"/><line x1="848" y1="140" x2="848" y2="112" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/><line x1="848" y1="112" x2="296" y2="112" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/><line x1="296" y1="112" x2="296" y2="136" stroke="#059669" stroke-width="1.6" marker-end="url(#a-green)" stroke-linecap="round"/><text x="572" y="104" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="400">retry after read</text><text x="36" y="262" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">Only the read tool records observation; cat does not satisfy the guard. edit and delete also require it.</text></svg>