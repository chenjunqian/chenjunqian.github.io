<svg xmlns="http://www.w3.org/2000/svg" width="960" height="274" viewBox="0 0 960 274"><defs><marker id="a-mut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><rect width="960" height="274" fill="#ffffff"/><text x="36" y="42" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0f172a" text-anchor="start" font-weight="650">Why: three drivers, only one about model fallibility</text><rect x="36" y="80" width="248" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="56" y="110" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2563eb" text-anchor="start" font-weight="650">Concurrency</text><text x="56" y="136" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="400">A unary classifier cannot compare</text><text x="56" y="156" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="400">siblings, so the scheduler fails closed.</text><text x="56" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="600">cost: grep/glob serialized</text><rect x="356" y="80" width="248" height="130" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/><text x="376" y="110" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#059669" text-anchor="start" font-weight="650">Auditability</text><text x="376" y="136" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="400">Model-visible ⇔ logged: replay, resume,</text><text x="376" y="156" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="400">snapshot tests, multi-client UI.</text><text x="376" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#059669" text-anchor="start" font-weight="600">cost: envelopes + line numbers</text><rect x="676" y="80" width="248" height="130" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/><text x="696" y="110" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#b45309" text-anchor="start" font-weight="650">Breadth</text><text x="696" y="136" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="400">31 tools, jobs, sandbox, teams:</text><text x="696" y="156" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="400">the harness is a platform.</text><text x="696" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="600">cost: 27.6 KB + poll loops</text><text x="36" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">A stronger model still cannot see a sibling call writing the same file.</text></svg>