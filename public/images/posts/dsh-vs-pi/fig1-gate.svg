<svg xmlns="http://www.w3.org/2000/svg" width="960" height="362" viewBox="0 0 960 362"><defs><marker id="a-mut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><rect width="960" height="362" fill="#ffffff"/><text x="36" y="46" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" fill="#0f172a" text-anchor="start" font-weight="650">Only an explicit true runs concurrently</text><text x="36" y="72" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">Fail-closed scheduling: a missing classifier, false, or a throw becomes an exclusive barrier.</text><rect x="36" y="112" width="130" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="101" y="143" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="550">tool call</text><line x1="166" y1="138" x2="232" y2="138" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-mut)" stroke-linecap="round"/><rect x="236" y="106" width="250" height="76" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="361" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="400">isConcurrencySafe(args)</text><text x="361" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle" font-weight="400">returns true?</text><line x1="486" y1="122" x2="596" y2="122" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)" stroke-linecap="round"/><text x="541" y="112" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">true</text><rect x="600" y="94" width="236" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="718" y="117" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="650">parallel pool</text><text x="718" y="137" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="400">up to 10 in flight</text><rect x="600" y="158" width="49.76" height="26" rx="7" fill="#fff" stroke="#bfdbfe" stroke-width="1"/><text x="624.88" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="400">read</text><rect x="657.76" y="158" width="94.4" height="26" rx="7" fill="#fff" stroke="#bfdbfe" stroke-width="1"/><text x="704.96" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="400">read_image</text><rect x="760.16" y="158" width="42.32" height="26" rx="7" fill="#fff" stroke="#bfdbfe" stroke-width="1"/><text x="781.3199999999999" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="400">web</text><rect x="810.48" y="158" width="79.52" height="26" rx="7" fill="#fff" stroke="#bfdbfe" stroke-width="1"/><text x="850.24" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="400">subagent</text><line x1="361" y1="182" x2="361" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-mut)" stroke-linecap="round"/><text x="371" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">false / missing / throw</text><rect x="236" y="210" width="250" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="361" y="233" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="650">exclusive call</text><text x="361" y="253" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="400">= ordering barrier</text><rect x="236" y="274" width="49.76" height="26" rx="7" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="260.88" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="400">grep</text><rect x="293.76" y="274" width="49.76" height="26" rx="7" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="318.64" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="400">glob</text><rect x="351.52" y="274" width="49.76" height="26" rx="7" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="376.4" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="400">bash</text><rect x="409.28" y="274" width="57.2" height="26" rx="7" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="437.88" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="400">write</text><rect x="474.47999999999996" y="274" width="49.76" height="26" rx="7" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="499.35999999999996" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="400">edit</text><rect x="532.24" y="274" width="27.439999999999998" height="26" rx="7" fill="#fff" stroke="#fecaca" stroke-width="1"/><text x="545.96" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="400">…</text><text x="36" y="338" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">The loop reclassifies every call before it starts; registry changes can turn a later call into a new barrier.</text></svg>